<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医院床位管理系统 - 主页面</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .room-card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .room-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .room-number {
            font-size: 24px;
            font-weight: bold;
            color: #0066cc;
        }
        .room-status {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
        .header {
            text-align: center;
            padding: 20px;
            background-color: #0066cc;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>每日床位使用登记</h1>
        
    </div>

    <div class="room-grid">
        <div class="room-card" onclick="location.href='room601.html'">
            <div class="room-number">601室</div>
            <div class="room-status">20张床位</div>
        </div>
        <div class="room-card" onclick="location.href='room602.html'">
            <div class="room-number">602室</div>
            <div class="room-status" id="room602-status">6张床位</div>
        </div>
        <div class="room-card" onclick="location.href='room603.html'">
            <div class="room-number">603室</div>
            <div class="room-status">6张床位</div>
        </div>
        <div class="room-card" onclick="location.href='room605.html'">
            <div class="room-number">605室</div>
            <div class="room-status">6张床位数</div>
        </div>
        <div class="room-card" onclick="location.href='room606.html'">
            <div class="room-number">606室</div>
            <div class="room-status">42张床位数</div>
        </div>
        <div class="room-card" onclick="location.href='room607.html'">
            <div class="room-number">607室</div>
            <div class="room-status">40张床位数</div>
        </div>
        <!-- 可以添加更多房间 -->
    </div>

    <div class="footer">
        <div class="instructions">
            <p>请填写使用意见<input type="text" id="advise" min="0" style="width:1000px" style="height: 180px"></p>
           
        </div>
    </div>

    <script>
        // 更新房间床位信息
        function updateRoomBedInfo() {
            // 更新602室信息
            const room602Info = JSON.parse(localStorage.getItem('room602Info') || '{}');
            const room602Status = document.getElementById('room602-status');
            if (room602Status && room602Info.totalBeds) {
                const originalText = `${room602Info.totalBeds}张床位`;
                const additionalText = room602Info.additionalBeds > 0 ? 
                    ` (原有${room602Info.originalBeds}张 + 加床${room602Info.additionalBeds}张)` : '';
                room602Status.innerHTML = originalText + additionalText;
                
                // 如果有加床，显示特殊样式
                if (room602Info.additionalBeds > 0) {
                    room602Status.style.color = '#52c41a';
                    room602Status.style.fontWeight = 'bold';
                }
            }
            
            // 可以为其他房间添加类似逻辑
        }
        
        // 页面加载时更新信息
        document.addEventListener('DOMContentLoaded', updateRoomBedInfo);
        
        // 定时更新信息
        setInterval(updateRoomBedInfo, 5000); // 每5秒更新一次
        
        // 监听存储变化
        window.addEventListener('storage', updateRoomBedInfo);
    </script>
</body>
</html>
