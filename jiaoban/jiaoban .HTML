<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新生儿科病房护理交班志</title>
    <style>
        :root {
            --primary-color: #0d6efd;
            --primary-hover: #0b5ed7;
            --secondary-color: #6c757d;
            --secondary-hover: #5c636a;
            --success-color: #198754;
            --success-hover: #157347;
            --danger-color: #dc3545;
            --danger-hover: #bb2d3b;
            --info-color: #0dcaf0;
            --info-hover: #31d2f2;
            --warning-color: #ffc107;
            --warning-hover: #ffca2c;
            --light-gray: #f8f9fa;
            --border-color: #dee2e6;
            --text-color: #212529;
            --text-muted: #6c757d;
            --box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            --border-radius: 0.375rem;
        }
        /* 为所有需要自动调整的输入框添加统一样式 */
.auto-resize-input {
    resize: none;
    overflow: hidden;
    line-height: 1.4;
    min-height: 32px; /* 单行最小高度 */
    font-family: inherit;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    padding: 6px 8px;
    font-size: 12px;
    width: 100%;
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', sans-serif;
            background-color: var(--light-gray);
            color: var(--text-color);
            line-height: 1.5;
        }
        
        .container {
            margin: 0 auto;
            padding: 20px 2%;
            background: white;
            min-height: 100vh;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: 10px;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .controls .form-group {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }
        
        .controls .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);
        }
        
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--secondary-color); color: white; }
        .btn-secondary:hover { background: var(--secondary-hover); }
        .btn-danger { background: var(--danger-color); color: white; }
        .btn-danger:hover { background: var(--danger-hover); }
        .btn-info { background: var(--info-color); color: white; }
        .btn-info:hover { background: var(--info-hover); }
        .btn-warning { background: var(--warning-color); color: black; }
        .btn-warning:hover { background: var(--warning-hover); }
        
        .form-group label {
            font-weight: 500;
            margin-bottom: 0;
            color: var(--text-muted);
        }
        
        input, textarea {
            transition: border-color .15s ease-in-out,box-shadow .15s ease-in-out;
        }
        input:focus, textarea:focus {
            border-color: #86b7fe;
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgb(13 110 253 / 25%);
        }

        .form-group input {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
        }
        
        .shifts-container, .patients-section, .stats-panel {
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: white;
            box-shadow: var(--box-shadow);
        }

        .shifts-container {
            display: flex;
            gap: 0; /* Remove gap, use borders only */
        }
        
        .shift-column {
            flex: 1;
        }

        .shift-column + .shift-column {
            border-left: 1px solid var(--border-color);
        }
        
        .shift-header {
            background: var(--light-gray);
            padding: 12px;
            text-align: center;
            font-weight: 500;
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--primary-color);
        }
        
        .shift-content {
            padding: 15px;
        }
        
        .shift-section {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .shift-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .shift-grid-rooms {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .shift-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .shift-grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .field-group {
            display: flex;
            flex-direction: column;
        }
        
        .field-group label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        
        .field-group input {
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 12px;
            width: 100%; /* Ensure input takes full width of its container */
        }
        
        .special-care-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .special-care-item label {
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-right: 8px;
        }
        
        .special-care-item input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 12px;
            text-align: left;
        }

        .special-care-group {
            border: 1px solid #f1f3f5;
            padding: 10px;
            border-radius: var(--border-radius);
            margin-bottom: 10px;
            background-color: #fcfdff;
        }
        .group-label {
            font-weight: 500;
            font-size: 13px;
            margin-bottom: 8px;
            display: block;
            color: var(--text-color);
        }
        
        .patients-header {
            background: var(--light-gray);
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .patients-header h3 {
            font-weight: 500;
            font-size: 16px;
            color: var(--text-color);
        }
        
        .patients-table {
            width: 100%;
            border-collapse: collapse;
            border: none; /* Remove outer table border, use container border */
        }
        
        .patients-table th,
        .patients-table td {
            border: none;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 15px;
            text-align: left;
            vertical-align: top;
        }

        .patients-table th {
            background: var(--light-gray);
            font-weight: 500;
            font-size: 14px;
            color: var(--text-muted);
            padding: 15px;
        }

        .patients-table tbody tr:nth-child(odd) {
            background-color: #fcfcfd;
        }

        .patients-table tbody tr:hover {
            background-color: #f1f3f5;
        }
        
        .patients-table input,
        .patients-table textarea,
        .patients-table select {
            width: 100%;
            border: 1px solid #ced4da;
            border-radius: var(--border-radius);
            padding: 6px 8px;
            font-size: 12px;
        }
        
        .patients-table textarea {
    resize: none;
    min-height: 40px;
    overflow: hidden; /* 隐藏滚动条 */
    line-height: 1.4;
}
        
        .empty-patients {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-style: italic;
        }
        
        .stats-panel {
            padding: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            text-align: center;
            border: 1px solid var(--border-color);
        }
        
        .stat-label {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 500;
        }
        
        .stat-value.blue { color: var(--primary-color); }
        .stat-value.green { color: var(--success-color); }
        .stat-value.orange { color: var(--warning-color); }
        .stat-value.purple { color: #6f42c1; }
        .stat-value.indigo { color: #3f51b5; }
        .stat-value.red { color: var(--danger-color); }
        
        .hidden {
            display: none;
        }
        
        @media print {
            .no-print { display: none !important; }
            .container { padding: 10px; box-shadow: none; border: none; }
            .shifts-container, .patients-section, .stats-panel { box-shadow: none; border: 1px solid #999; }
            body { background: white; }
            @page { margin: 1cm; size: A4 landscape; }
        }
        
        @media (max-width: 768px) {
            .shifts-container {
                flex-direction: column;
            }
            .shift-column {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .shift-column:last-child {
                border-bottom: none;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>新生儿科病房护理交班志</h1>
        </div>
        
        <div class="controls no-print">
            <div class="form-group">
                <label>日期:</label>
                <input type="date" id="date">
            </div>
            <div class="buttons">
                <button class="btn btn-primary" onclick="toggleStats()">📊 统计</button>
                <button class="btn btn-secondary" onclick="saveAsPDF()">📄 存储为PDF</button>
                <button class="btn btn-success" onclick="saveAsHTML()">💾 存储为HTML</button>
                <button class="btn btn-info" onclick="saveData()">💾 暂存</button>
                <button class="btn btn-warning" onclick="loadData()">📂 加载</button>
                <button class="btn btn-danger" onclick="clearData()">🗑️ 重置</button>
            </div>
        </div>
        
        <div id="statsPanel" class="stats-panel no-print hidden">
            <h3 style="margin-bottom: 15px; font-weight: 500;">今日统计</h3>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-label">总入院</div><div class="stat-value blue" id="statAdmissions">0</div></div>
                <div class="stat-card"><div class="stat-label">总出院</div><div class="stat-value green" id="statDischarges">0</div></div>
                <div class="stat-card"><div class="stat-label">总转科</div><div class="stat-value orange" id="statTransfers">0</div></div>
                <div class="stat-card"><div class="stat-label">总手术</div><div class="stat-value purple" id="statSurgeries">0</div></div>
                <div class="stat-card"><div class="stat-label">平均患者数</div><div class="stat-value indigo" id="statAvgPatients">0</div></div>
                <div class="stat-card"><div class="stat-label">死亡病例</div><div class="stat-value red" id="statDeaths">0</div></div>
            </div>
        </div>
        
        <div class="shifts-container">
            <!-- Day Shift -->
            <div class="shift-column">
                <div class="shift-header">日班</div>
                <div class="shift-content">
                    <div class="shift-section">
                        <div class="shift-grid-rooms">
                            <div class="field-group"><label>601:</label><input type="number" id="day_room_601" min="0"></div>
                            <div class="field-group"><label>602:</label><input type="number" id="day_room_602" min="0"></div>
                            <div class="field-group"><label>603:</label><input type="number" id="day_room_603" min="0"></div>
                            <div class="field-group"><label>605:</label><input type="number" id="day_room_605" min="0"></div>
                            <div class="field-group"><label>负压:</label><input type="number" id="day_room_neg_pressure" min="0"></div>
                            <div class="field-group"><label>606:</label><input type="number" id="day_room_606" min="0"></div>
                            <div class="field-group"><label>607:</label><input type="number" id="day_room_607" min="0"></div>
                        </div>
                    </div>
                    <div class="shift-section">
                        <div class="shift-grid">
                            <div class="field-group"><label>患者总数:</label><input type="number" id="day_totalPatients" min="0" onchange="updateStats()"></div>
                            <div class="field-group"><label>请假外出:</label><input type="number" id="day_onLeave" min="0"></div>
                            <div class="field-group"><label>特、一级护理数:</label><input type="number" id="day_specialCare" min="0"></div>
                            <div class="field-group"><label>出车未回:</label><input type="number" id="day_outOnCall" min="0"></div>
                        </div>
                    </div>
                    <div class="shift-section">
                        <div class="shift-grid-3">
                            <div class="field-group"><label>入院:</label><input type="number" id="day_admissions" min="0" onchange="updateStats()"></div>
                            <div class="field-group"><label>出院:</label><input type="number" id="day_discharges" min="0" onchange="updateStats()"></div>
                            <div class="field-group"><label>死亡:</label><input type="number" id="day_deaths" min="0" onchange="updateStats()"></div>
                            <div class="field-group"><label>转入:</label><input type="number" id="day_transfers_in" min="0" onchange="updateStats()"></div>
                            <div class="field-group"><label>转出:</label><input type="number" id="day_transfers_out" min="0" onchange="updateStats()"></div>
                            <div class="field-group"><label>手术:</label><input type="number" id="day_surgeries" min="0" onchange="updateStats()"></div>
                        </div>
                    </div>
                    <div class="shift-section">
                        <div class="special-care-group">
                            <label class="group-label">上呼吸机患者:</label>
                            <div class="special-care-item"><label>气管插管:</label><textarea class="auto-resize-input"  id="day_ventilator_intubation"oninput="autoResize(this)"></textarea></div>
                            <div class="special-care-item"><label>NIPPV:</label><textarea class="auto-resize-input" id="day_ventilator_nippv" oninput="autoResize(this)"></textarea> </div>
                            <div class="special-care-item"><label>CPAP:</label><textarea class="auto-resize-input"  id="day_ventilator_cpap" oninput="autoResize(this)"></textarea></div>
                        </div>
                        
                        <div class="special-care-group">
                            <label class="group-label">中心静脉置管患者:</label>
                            <div class="special-care-item"><label>PICC:</label><textarea class="auto-resize-input" id="day_centralVenous_picc"oninput="autoResize(this)"></textarea></div>
                            <div class="special-care-item"><label>UVC:</label><input type="text" id="day_centralVenous_uvc"></div>
                            <div class="special-care-item"><label>CVC:</label><input type="text" id="day_centralVenous_cvc"></div>
                        </div>
                        <div class="special-care-group">
                            <label class="group-label">留置引流管患者:</label>
                            <div class="special-care-item"><label>尿管:</label><input type="text" id="day_drainage_urinary"></div>
                            <div class="special-care-item"><label>胸腔引流管:</label><input type="text" id="day_drainage_chest"></div>
                            <div class="special-care-item"><label>腹腔引流管:</label><input type="text" id="day_drainage_abdominal"></div>
                            <div class="special-care-item"><label>脑室引流管:</label><input type="text" id="day_drainage_ventricular"></div>
                            <div class="special-care-item"><label>胃肠减压引流:</label><input type="text" id="day_drainage_gi"></div>
                            <div class="special-care-item"><label>特殊:</label><input type="text" id="day_drainage_special"></div>
                        </div>
                        <div class="special-care-item"><label>有创动脉监测患者:</label><input type="text" id="day_arterialMonitor"></div>
                        <div class="special-care-item"><label>输全血、RBC、血小板患者:</label><input type="text" id="day_bloodTransfusion"></div>
                        <div class="special-care-item"><label>亚低温患者:</label><input type="text" id="day_hypothermia"></div>
                        <div class="special-care-item"><label>明天手术患者:</label><input type="text" id="day_tomorrowSurgery"></div>
                    </div>
                    <div class="in_and_out">
                            <label class="group-label">出入院:</label>
                            <div class="special-care-item"><label>入院:</label><input type="text" id="day_drainage_urinary"></div>
                    </div>
                    <div class="shift-section">
                        <div class="shift-grid" style="grid-template-columns: 1fr 1fr;">
                        <div class="field-group"><label>A班交班护士:</label><input type="text" id="day_handover_nurse" ></div>
                        <div class="field-group"><label>P班接班护士:</label><input type="text" id="day_takeover_nurse" ></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Evening Shift -->
            <div class="shift-column">
                <div class="shift-header">晚班</div>
                <div class="shift-content">
                    <div class="shift-section">
                        <div class="shift-grid-rooms">
                            <div class="field-group"><label>601:</label><input type="number" id="evening_room_601" min="0"></div>
                            <div class="field-group"><label>602:</label><input type="number" id="evening_room_602" min="0"></div>
                            <div class="field-group"><label>603:</label><input type="number" id="evening_room_603" min="0"></div>
                            <div class="field-group"><label>605:</label><input type="number" id="evening_room_605" min="0"></div>
                            <div class="field-group"><label>负压病房:</label><input type="number" id="evening_room_neg_pressure" min="0"></div>
                            <div class="field-group"><label>606:</label><input type="number" id="evening_room_606" min="0"></div>
                            <div class="field-group"><label>607:</label><input type="number" id="evening_room_607" min="0"></div>
                        </div>
                    </div>
                    <div class="shift-section">
                        <div class="shift-grid">
                            <div class="field-group"><label>患者总数:</label><input type="number" id="evening_totalPatients" min="0" onchange="updateStats()"></div>
                            <div class="field-group"><label>请假外出:</label><input type="number" id="evening_onLeave" min="0"></div>
                            <div class="field-group"><label>特、一级护理数:</label><input type="number" id="evening_specialCare" min="0"></div>
                            <div class="field-group"><label>出车未回:</label><input type="number" id="evening_outOnCall" min="0"></div>
                        </div>
                    </div>
                    <div class="shift-section">
                        <div class="shift-grid-3">
                            <div class="field-group"><label>入院:</label><input type="number" id="evening_admissions" min="0" onchange="updateStats()"></div>
                            <div class="field-group"><label>出院:</label><input type="number" id="evening_discharges" min="0" onchange="updateStats()"></div>
                            <div class="field-group"><label>死亡:</label><input type="number" id="evening_deaths" min="0" onchange="updateStats()"></div>
                            <div class="field-group"><label>转入:</label><input type="number" id="evening_transfers_in" min="0" onchange="updateStats()"></div>
                            <div class="field-group"><label>转出:</label><input type="number" id="evening_transfers_out" min="0" onchange="updateStats()"></div>
                            <div class="field-group"><label>手术:</label><input type="number" id="evening_surgeries" min="0" onchange="updateStats()"></div>
                        </div>
                    </div>
                    <div class="shift-section">
                        <div class="special-care-group">
                            <label class="group-label">上呼吸机患者:</label>
                            <div class="special-care-item"><label>气管插管:</label><textarea class="auto-resize-input"  id="evening_ventilator_intubation"oninput="autoResize(this)"></textarea></div>
                            <div class="special-care-item"><label>NIPPV:</label><textarea class="auto-resize-input" id="evening_ventilator_nippv" oninput="autoResize(this)"></textarea> </div>
                            <div class="special-care-item"><label>CPAP:</label><textarea class="auto-resize-input"  id="evening_ventilator_cpap" oninput="autoResize(this)"></textarea></div>
                        </div>
                        <div class="special-care-group">
                            <label class="group-label">中心静脉置管患者:</label>
                            <div class="special-care-item"><label>PICC:</label><textarea class="auto-resize-input" id="evening_centralVenous_picc"oninput="autoResize(this)"></textarea></div>
                            <div class="special-care-item"><label>UVC:</label><input type="text" id="evening_centralVenous_uvc"></div>
                            <div class="special-care-item"><label>CVC:</label><input type="text" id="evening_centralVenous_cvc"></div>
                        </div>
                        <div class="special-care-group">
                            <label class="group-label">留置引流管患者:</label>
                            <div class="special-care-item"><label>尿管:</label><input type="text" id="evening_drainage_urinary"></div>
                            <div class="special-care-item"><label>胸腔引流管:</label><input type="text" id="evening_drainage_chest"></div>
                            <div class="special-care-item"><label>腹腔引流管:</label><input type="text" id="evening_drainage_abdominal"></div>
                            <div class="special-care-item"><label>脑室引流管:</label><input type="text" id="evening_drainage_ventricular"></div>
                            <div class="special-care-item"><label>胃肠减压引流:</label><input type="text" id="evening_drainage_gi"></div>
                            <div class="special-care-item"><label>特殊:</label><input type="text" id="evening_drainage_special"></div>
                        </div>

        <div class="patients-section">
            <div class="patients-header">
                <h3>病室动态 / 护理内容</h3>
                <div class="no-print" style="display: flex; flex-wrap: wrap; gap: 10px;">
                <button class="btn btn-success" onclick="addPatient('皮损')">➕ 皮损</button>
                <button class="btn btn-success" onclick="addPatient('静脉炎')">➕ 静脉炎</button>
                <button class="btn btn-success" onclick="addPatient('压疮')">➕ 压疮</button>
                <button class="btn btn-success" onclick="addPatient('臀红')">➕ 臀红</button>
                <button class="btn btn-secondary" onclick="addPatient('其他')">➕ 其他</button>
            </div>
            </div>
            <div id="patientsTable">
                <table class="patients-table">
                    <thead>
                        <tr>
                            <th style="width: 15%">问题</th>
                            <th style="width: 10%">房间</th>
                            <th style="width: 10%">床号</th>
                            <th style="width: 30%">诊断</th>
                            <th style="width: 30%">处理</th>
                            <th style="width: 10%" class="no-print">操作</th>
                        </tr>
                    </thead>
                    <tbody id="patientsBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
        
        let patientCount = 0;
        let patients = [];

        function addPatient(category = '') {
            patientCount++;
            const patient = { id: patientCount, category: category, bedNumber: '', name: '', diagnosis: '', notes: '' };
            patients.push(patient);
            renderPatients();
        }
        function autoResize(textarea) {
             textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }
        function removePatient(id) {
            patients = patients.filter(p => p.id !== id);
            renderPatients();
        }

        function updatePatient(id, field, value) {
            const patient = patients.find(p => p.id === id);
            if (patient) {
                patient[field] = value;
            }
        }

        function renderPatients() {
            const tbody = document.getElementById('patientsBody');
            if (patients.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-patients">暂无患者记录，点击"添加患者"按钮添加</td></tr>';
                return;
            }
            tbody.innerHTML = patients.map(patient => `
                <tr>
                    <td>
                        <select onchange="updatePatient(${patient.id}, 'category', this.value)">
                            <option value="" ${!patient.category ? 'selected' : ''}>- 请选择 -</option>
                            <option value="静脉炎" ${patient.category === '静脉炎' ? 'selected' : ''}>静脉炎</option>
                            <option value="皮损" ${patient.category === '皮损' ? 'selected' : ''}>皮损</option>
                            <option value="臀红" ${patient.category === '臀红' ? 'selected' : ''}>臀红</option>
                            <option value="压疮" ${patient.category === '压疮' ? 'selected' : ''}>压疮</option>
                            <option value="其他" ${patient.category === '其他' ? 'selected' : ''}>其他</option>
                        </select>
                    </td>
                    <td>
                        <select onchange="updatePatient(${patient.id}, 'bedNumber', this.value)">
                            <option value="" ${!patient.bedNumber ? 'selected' : ''}>- 请选择 -</option>
                            <option value="601" ${patient.bedNumber === '601' ? 'selected' : ''}>601</option>
                            <option value="602" ${patient.bedNumber === '602' ? 'selected' : ''}>602</option>
                            <option value="603" ${patient.bedNumber === '603' ? 'selected' : ''}>603</option>
                            <option value="605" ${patient.bedNumber === '605' ? 'selected' : ''}>605</option>
                            <option value="负压" ${patient.bedNumber === '负压' ? 'selected' : ''}>负压</option>
                            <option value="606" ${patient.bedNumber === '606' ? 'selected' : ''}>606</option>
                            <option value="607" ${patient.bedNumber === '607' ? 'selected' : ''}>607</option>
                        </select>
                    </td>
                    <td><input type="text" value="${patient.name}" onchange="updatePatient(${patient.id}, 'name', this.value)"></td>
                    <td><input type="text" value="${patient.diagnosis}" onchange="updatePatient(${patient.id}, 'diagnosis', this.value)"></td>
                    <td><textarea oninput="autoResize(this)" onchange="updatePatient(${patient.id}, 'notes', this.value)">${patient.notes}</textarea></td>
                    <td class="no-print"><button class="btn btn-danger" onclick="removePatient(${patient.id})">🗑️</button></td>
                </tr>
            `).join('');
        }

        function getFieldValue(id) {
            const element = document.getElementById(id);
            return element ? (element.type === 'number' ? parseInt(element.value) || 0 : element.value) : 0;
        }

        function updateStats() {
            const stats = {
                totalAdmissions: getFieldValue('day_admissions') + getFieldValue('evening_admissions') + getFieldValue('night_admissions'),
                totalDischarges: getFieldValue('day_discharges') + getFieldValue('evening_discharges') + getFieldValue('night_discharges'),
                totalTransfers: (getFieldValue('day_transfers_in') + getFieldValue('evening_transfers_in') + getFieldValue('night_transfers_in')) +
                               (getFieldValue('day_transfers_out') + getFieldValue('evening_transfers_out') + getFieldValue('night_transfers_out')),
                totalSurgeries: getFieldValue('day_surgeries') + getFieldValue('evening_surgeries') + getFieldValue('night_surgeries'),
                averagePatients: Math.round((getFieldValue('day_totalPatients') + getFieldValue('evening_totalPatients') + getFieldValue('night_totalPatients')) / 3),
                totalDeaths: getFieldValue('day_deaths') + getFieldValue('evening_deaths') + getFieldValue('night_deaths')
            };
            document.getElementById('statAdmissions').textContent = stats.totalAdmissions;
            document.getElementById('statDischarges').textContent = stats.totalDischarges;
            document.getElementById('statTransfers').textContent = stats.totalTransfers;
            document.getElementById('statSurgeries').textContent = stats.totalSurgeries;
            document.getElementById('statAvgPatients').textContent = isNaN(stats.averagePatients) ? 0 : stats.averagePatients;
            document.getElementById('statDeaths').textContent = stats.totalDeaths;
        }

        function toggleStats() {
            const panel = document.getElementById('statsPanel');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
                updateStats();
            }
        }

        function saveAsPDF() {
            const element = document.querySelector('.container');
            const dateString = document.getElementById('date').value || new Date().toISOString().split('T')[0];
            const opt = {
                margin:       [10, 5, 10, 5], // top, left, bottom, right in mm
                filename:     `新生儿科病房护理交班志-${dateString}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };
            
            // Temporarily hide elements with .no-print class
            const noPrintElements = document.querySelectorAll('.no-print');
            noPrintElements.forEach(el => el.style.display = 'none');
            
            html2pdf().from(element).set(opt).save().then(() => {
                // Show the elements again after PDF is generated
                noPrintElements.forEach(el => el.style.display = '');
            }).catch(err => {
                // Ensure elements are shown again even if there's an error
                noPrintElements.forEach(el => el.style.display = '');
                console.error('Could not generate PDF:', err);
                alert('生成PDF失败，请查看控制台获取更多信息。');
            });
        }

        function saveAsHTML() {
            // Create a clone of the document to avoid modifying the live page
            const clonedDocument = document.cloneNode(true);

            // Update input values in the cloned document to ensure they are saved in the HTML
            const originalInputs = document.querySelectorAll('input, textarea, select');
            const clonedInputs = clonedDocument.querySelectorAll('input, textarea, select');

            originalInputs.forEach((originalInput, index) => {
                const clonedInput = clonedInputs[index];
                if (originalInput.type === 'checkbox' || originalInput.type === 'radio') {
                    if (originalInput.checked) {
                        clonedInput.setAttribute('checked', 'checked');
                    } else {
                        clonedInput.removeAttribute('checked');
                    }
                } else if (originalInput.tagName.toLowerCase() === 'textarea') {
                    clonedInput.innerHTML = originalInput.value;
                } else { // text, number, date, etc.
                    clonedInput.setAttribute('value', originalInput.value);
                }
            });

            // Get the full HTML of the modified clone
            const htmlString = clonedDocument.documentElement.outerHTML;

            // Create a Blob and trigger download
            const blob = new Blob([htmlString], { type: 'text/html' });
            const a = document.createElement('a');
            const dateString = document.getElementById('date').value || new Date().toISOString().split('T')[0];
            a.download = `交班单-${dateString}.html`;
            a.href = URL.createObjectURL(blob);
            document.body.appendChild(a); // Required for Firefox
            a.click();
            document.body.removeChild(a); // Clean up
            URL.revokeObjectURL(a.href);
        }

        function getFields() {
            return [
                'room_601', 'room_602', 'room_603', 'room_605', 'room_neg_pressure', 'room_606', 'room_607',
                'totalPatients', 'onLeave', 'specialCare', 'outOnCall',
                'admissions', 'discharges', 'deaths', 'transfers_in', 'transfers_out', 'surgeries',
                'ventilator_intubation', 'ventilator_nippv', 'ventilator_cpap',
                'arterialMonitor',
                'centralVenous_picc', 'centralVenous_uvc', 'centralVenous_cvc',
                'drainage_urinary', 'drainage_chest', 'drainage_abdominal', 'drainage_ventricular', 'drainage_gi', 'drainage_special',
                'bloodTransfusion', 'hypothermia', 'tomorrowSurgery', 
                'clinicalPath', 'communication', 'signature'
            ];
        }

        function saveData() {
            const shifts = ['day', 'evening', 'night'];
            const fields = getFields();
            const data = { date: getFieldValue('date'), shifts: {}, patients: patients };
            shifts.forEach(shift => {
                data.shifts[shift] = {};
                fields.forEach(field => {
                    data.shifts[shift][field] = getFieldValue(`${shift}_${field}`);
                });
            });
            localStorage.setItem('nursingHandoverData', JSON.stringify(data));
            alert('数据已保存到本地！');
        }

        function loadData() {
            const savedData = localStorage.getItem('nursingHandoverData');
            if (savedData) {
                const shouldLoad = confirm('确定要从本地加载数据吗？这将覆盖当前所有未保存的修改。');
                if (!shouldLoad) return;
                const data = JSON.parse(savedData);
                _loadDataInternal(data);
                alert('数据加载成功！');
            } else {
                alert('没有找到可加载的本地数据。');
            }
        }

        function clearData() {
            if (confirm('确定要清空所有数据吗？此操作不可撤销。')) {
                document.getElementById('date').value = new Date().toISOString().split('T')[0];
                const form = document.querySelector('.container');
                const inputs = form.querySelectorAll('input[type="text"], input[type="number"], textarea');
                inputs.forEach(input => {
                    if (input.id !== 'date') input.value = '';
                });
                patients = [];
                patientCount = 0;
                renderPatients();
                updateStats();
                alert('所有数据已清空。');
            }
        }

        function _loadDataInternal(data) {
            document.getElementById('date').value = data.date || new Date().toISOString().split('T')[0];
            const shifts = ['day', 'evening', 'night'];
            const fields = getFields();
            shifts.forEach(shift => {
                fields.forEach(field => {
                    const element = document.getElementById(`${shift}_${field}`);
                    if (element) {
                        element.value = (data.shifts && data.shifts[shift] && data.shifts[shift][field] !== undefined) ? data.shifts[shift][field] : '';
                    }
                });
            });
            if (data.patients) {
                patients = data.patients;
                patientCount = patients.length > 0 ? Math.max(0, ...patients.map(p => p.id)) : 0;
            } else {
                patients = [];
                patientCount = 0;
            }
            renderPatients();
            updateStats();
        }

        window.addEventListener('load', function() {
            renderPatients();
            updateStats();
            // 初始化所有 textarea 的高度
    document.querySelectorAll('textarea').forEach(textarea => {
        autoResize(textarea);
        });
    });
    </script>
