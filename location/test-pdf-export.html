<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试PDF导出功能</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="pdf-export.js"></script>
    <style>
        .test-container {
            width: 500px;
            height: 400px;
            background-color: white;
            border: 2px solid #333;
            position: relative;
            margin: 20px auto;
            padding: 20px;
        }
        
        .bed {
            position: absolute;
            border: 2px solid #333;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 40px;
            height: 80px;
        }
        
        .bed-empty {
            background-color: #e8f5e9; /* 浅绿色 - 空床 */
        }

        .bed-occupied {
            background-color: #ffebee; /* 浅红色 - 占用 */
        }

        .bed-discharge_planned {
            background-color: #fff8e1; /* 浅黄色 - 拟出院 */
        }
        
        .bed-label {
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            padding: 2px;
            background-color: #e0e0e0;
        }
        
        .patient-area {
            font-size: 15px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
        }
        
        .signature-box {
            text-align: center;
            margin: 20px 0;
        }
        
        .room-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="room-title">
        <span id="current-date"></span>测试房间床位分布图
    </div>
           
    <div class="signature-box">
        <div>
            护士签名: <input type="text" id="nurse-signature" style="width: 200px;">
        </div>
        <button id="pdf-export-btn" style="margin-top: 20px; padding: 10px 20px; background-color: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer;">导出PDF</button>
    </div>

    <script>
        // Set current date
        const now = new Date();
        document.getElementById('current-date').textContent = 
            `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
        
        // 绑定PDF导出按钮事件
        document.getElementById('pdf-export-btn').addEventListener('click', function() {
            generateRoomPDF('test');
        });
        
        // 修改pdf-export.js中的generateRoomPDF函数以适应测试
        function generateRoomPDF(roomNumber) {
            // 创建临时容器包含所有需要导出的元素
            const tempContainer = document.createElement('div');
            tempContainer.style.position = 'absolute';
            tempContainer.style.left = '-9999px';
            tempContainer.style.padding = '20px';
            tempContainer.style.backgroundColor = 'white';
            tempContainer.style.boxSizing = 'border-box';
            
            // 获取并验证元素
            const originalTitle = document.querySelector('.room-title');
            const originalContainer = document.querySelector(`#test-container`);
            const originalSignature = document.querySelector('.signature-box');
            
            if (!originalTitle || !originalContainer || !originalSignature) {
                console.error('Missing required elements for PDF export');
                return;
            }

            // 深度克隆元素
            const roomTitle = originalTitle.cloneNode(true);
            const roomContainer = originalContainer.cloneNode(true);
            const signatureBox = originalSignature.cloneNode(true);
            
            // 复制计算后的样式
            const titleStyles = window.getComputedStyle(originalTitle);
            const containerStyles = window.getComputedStyle(originalContainer);
            const signatureStyles = window.getComputedStyle(originalSignature);
            
            // 应用样式到克隆元素
            for (let i = 0; i < titleStyles.length; i++) {
                const prop = titleStyles[i];
                roomTitle.style[prop] = titleStyles.getPropertyValue(prop);
            }
            
            for (let i = 0; i < containerStyles.length; i++) {
                const prop = containerStyles[i];
                roomContainer.style[prop] = containerStyles.getPropertyValue(prop);
            }
            
            for (let i = 0; i < signatureStyles.length; i++) {
                const prop = signatureStyles[i];
                signatureBox.style[prop] = signatureStyles.getPropertyValue(prop);
            }
            
            // 特别处理input元素的样式，确保高度正确
            const originalInputs = originalTitle.querySelectorAll('input');
            const clonedInputs = roomTitle.querySelectorAll('input');
            for (let i = 0; i < originalInputs.length; i++) {
                const originalInput = originalInputs[i];
                const clonedInput = clonedInputs[i];
                if (originalInput && clonedInput) {
                    const inputStyles = window.getComputedStyle(originalInput);
                    for (let j = 0; j < inputStyles.length; j++) {
                        const prop = inputStyles[j];
                        clonedInput.style[prop] = inputStyles.getPropertyValue(prop);
                    }
                    // 确保input元素可见并正确显示
                    clonedInput.style.display = '';
                    clonedInput.style.visibility = 'visible';
                }
            }
            
            // 确保克隆元素可见
            roomTitle.style.display = '';
            roomTitle.style.visibility = 'visible';
            roomContainer.style.display = '';
            roomContainer.style.visibility = 'visible';
            signatureBox.style.display = '';
            signatureBox.style.visibility = 'visible';
            
            // 添加到临时容器
            tempContainer.appendChild(roomTitle);
            tempContainer.appendChild(roomContainer);
            tempContainer.appendChild(signatureBox);
            document.body.appendChild(tempContainer);

            // 添加短暂延迟确保元素渲染完成
            setTimeout(() => {
                // 获取原始容器的尺寸
                const originalContainerWidth = originalContainer.offsetWidth;
                const originalContainerHeight = originalContainer.offsetHeight;
                
                // 设置临时容器的尺寸与原始容器一致
                tempContainer.style.width = originalContainerWidth + 40 + 'px'; // 加上padding
                tempContainer.style.height = 'auto';
                
                // 等待一帧确保尺寸更新
                requestAnimationFrame(() => {
                    html2canvas(tempContainer, {
                        scale: 2,
                        useCORS: true,
                        logging: true,
                        backgroundColor: '#FFFFFF',
                        allowTaint: true,
                        // 移除ignoreElements以避免过滤掉所有元素
                        width: tempContainer.scrollWidth,
                        height: tempContainer.scrollHeight
                    }).then(canvas => {
                        // 移除临时容器
                        document.body.removeChild(tempContainer);
                        const imageData = canvas.toDataURL('image/png');
                        const { jsPDF } = window.jspdf;
                        
                        // 根据内容尺寸计算PDF页面尺寸
                        const canvasWidth = canvas.width / 2; // 由于scale=2
                        const canvasHeight = canvas.height / 2; // 由于scale=2
                        const orientation = canvasWidth > canvasHeight ? 'l' : 'p';
                        const doc = new jsPDF(orientation, 'px', [canvasWidth, canvasHeight]);

                        // 将截图添加到PDF
                        doc.addImage(imageData, 'PNG', 0, 0, canvasWidth, canvasHeight);

                        // 保存PDF文件
                        const now = new Date();
                        const filename = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}_测试房间床位分布.pdf`;
                        doc.save(filename);
                    }).catch(error => {
                        // 移除临时容器
                        document.body.removeChild(tempContainer);
                        console.error('PDF generation failed:', error);
                    });
                });
            }, 100); // 增加延迟确保渲染完成
        }
    </script>
</body>
</html>
